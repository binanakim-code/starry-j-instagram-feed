name: Refresh Starry J Instagram feed

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/build_feed.py"
      - ".github/workflows/refresh-feed.yml"
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: refresh-starry-j-feed
  cancel-in-progress: true

jobs:
  build-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build one-item-per-product feed
        run: python scripts/build_feed.py

      - name: Commit updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/feed.xml
          if git diff --cached --quiet; then
            echo "Feed is already up to date."
            exit 0
          fi
          git commit -m "Refresh deduplicated product feed"
          git push
